<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ImbizoHub</title>
<meta name="theme-color" content="#FCF9F2" />
<meta name="description" content="Buy and sell with confidence in Zimbabwe. Chat, meet, and pay — backed by PIN-confirmed handovers and ratings from real completed deals." />
<style>
  :root{
    --bg:#FCF9F2; --panel:#FFFFFF; --panel-2:#F4EFE3; --line:#E4DCCB;
    --gold:#8A6608; --text:#1A1A18; --muted:#5C574B;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:20px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    background:var(--panel); border:1px solid var(--line);
    border-radius:16px; box-shadow:0 2px 20px rgba(26,26,24,.06);
    padding:44px 36px; max-width:430px; width:100%; text-align:center;
  }
  h1{font-size:31px; margin:0 0 10px; color:var(--gold); letter-spacing:-.02em}
  p.subtitle{color:var(--muted); font-size:15px; margin:0 0 30px}
  a.button{
    display:block; width:100%; padding:14px;
    background:var(--gold); color:#fff; text-decoration:none;
    border-radius:12px; font-size:15px; font-weight:700; margin-bottom:12px;
  }
  a.button:hover{background:#6f5206}
  .note{color:var(--muted); font-size:13px; margin:0}
  .links{
    margin-top:28px; padding-top:20px; border-top:1px solid var(--line);
    font-size:13px; color:var(--muted);
  }
  .links a{color:var(--muted); text-decoration:none; margin:0 7px}
  .links a:hover{color:var(--gold)}
</style>
</head>
<body>
  <div class="card">
    <h1>ImbizoHub</h1>
    <p class="subtitle">
      Buy and sell with confidence in Zimbabwe. Chat, meet, and pay — backed by
      PIN-confirmed handovers and ratings from real completed deals.
    </p>

    <!-- The Play Store URL is built from the package name in app.json
         (com.imbizohub.app), so it is fixed and correct before publication.
         It 404s until the production release goes live, then resolves with
         no change needed here. -->
    <a class="button" href="https://play.google.com/store/apps/details?id=com.imbizohub.app">
      Get it on Google Play
    </a>
    <p class="note">Free to download. Free to buy and sell.</p>

    <div class="links">
      <a href="https://imbizohub.com/">Website</a> ·
      <a href="privacy-policy.html">Privacy Policy</a> ·
      <a href="terms-of-service.html">Terms</a> ·
      <a href="delete-account.html">Delete Account</a>
    </div>
  </div>
</body>
</html>
